services:
  postgres:
    image: postgres:15-alpine
    container_name: soundspace-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: soundspace_db
      POSTGRES_USER: soundowner
      POSTGRES_PASSWORD: secret_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundowner -d soundspace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  soundspace-gateway:
    build:
      context: ./soundspace-gateway
      dockerfile: Dockerfile
    container_name: soundspace-gateway
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - GATEWAY_X_FORWARDED_PROTO=${GATEWAY_X_FORWARDED_PROTO:-true}
      - GATEWAY_X_FORWARDED_HOST=${GATEWAY_X_FORWARDED_HOST:-true}
      - GATEWAY_X_FORWARDED_PORT=${GATEWAY_X_FORWARDED_PORT:-true}
      - GATEWAY_X_FORWARDED_FOR=${GATEWAY_X_FORWARDED_FOR:-true}
    depends_on:
      - auth-server
      - qobuz-api-gateway
      - audio-library-service

  auth-server:
    build:
      context: ./auth-server
      dockerfile: Dockerfile
    container_name: auth-server
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/soundspace_db
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - BASE_URL=${BASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - FORWARD_HEADERS_STRATEGY=${FORWARD_HEADERS_STRATEGY:-framework}
      - JWT_SECRET=${JWT_SECRET}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  qobuz-api-gateway:
    build:
      context: ./qobuz-data-gateway
      dockerfile: Dockerfile
    container_name: qobuz-api-gateway
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      - QOBUZ_APP_ID=${QOBUZ_APP_ID}
      - QOBUZ_APP_SECRET=${QOBUZ_APP_SECRET}
      - QOBUZ_USER_TOKEN=${QOBUZ_USER_TOKEN}
      - QOBUZ_USER_ALTERNATE_TOKEN=${QOBUZ_USER_ALTERNATE_TOKEN}
      - SPRING_WEB_RESOURCES_STATIC_LOCATIONS=file:/static-content/
    volumes:
      - ./qobuz-data-gateway/src/main/resources/static:/static-content

  audio-library-service:
    build:
      context: ./audio-library-service
      dockerfile: Dockerfile
    container_name: audio-library-service
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/soundspace_library
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
