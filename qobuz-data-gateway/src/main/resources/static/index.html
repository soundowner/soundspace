<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest"></script><script src="tailwindcss.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">

    <style>
        #library_wrapper {
            position: absolute;
            width: 100dvw;
            top: 5%;
            height: 99dvh;
        }

        #library_navigation {
            position: absolute;
            width: 100%;
            height: 82%;
            box-shadow: 0 0 14px 3px black inset;
            pointer-events: none; /* Let clicks pass through to lists */
            top: 5%;
            z-index: 10;
        }

        #library-bottom-nav {
            position: absolute;
            width: 99%;
            height: 8%;
            top: 92%;
            left: 0.5%;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            justify-content: space-evenly;
            pointer-events: auto;
            will-change: backdrop-filter, transform;
            transform: translateZ(0);
        }



        .lib-nav {
            width: 20%;
            height: 100%;
            position: relative;
        }
    </style>
</head>
<body>
<div class="main-container">
    <div class="parent-container">
        <div class="top-search-panel" id="top-search-panel">
            <input type="search" enterkeyhint="search" id="search-input" placeholder="Search...">
        </div>
        <div class="content">
            <!-- Main content goes here -->
        </div>
        <div class="overlays-container">
            <div class="panel" id="user-panel">
                <div class="library-header-ss">
                    <h2 class="neon-text">PROFILE</h2>
                    <button id="user-settings-btn" style="background: none; border: none; color: var(--text-secondary); padding: 0 20px; cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent;">
                        <i class="fa-solid fa-gear" style="font-size: 20px;"></i>
                    </button>
                </div>
                <div id="user-profile-content" style="padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80%;">
                    
                    <div id="user-info-display" style="margin-top: 50px; text-align: center;">
                        <p style="color: coral; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;">Nexus Core Active</p>
                    </div>
                    
                    <button id="import-youtube-btn" style="margin-top: 30px; padding: 12px 24px; background-color: #ff0000; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif;">
                        <i class="fa-brands fa-youtube"></i> Import from YouTube
                    </button>
                    <div id="youtube-import-status" style="margin-top: 15px; color: var(--text-secondary); text-align: center; font-size: 0.9em; max-width: 80%;"></div>
                </div>
            </div>

            <div class="panel" id="library-panel">

                <div id="library_wrapper">
                    <div id="library_navigation">
                        <button id="create_playlist_btn">
                            <i data-lucide="plus"></i>
                            <span>create</span>
                        </button>

                        <div id="library-bottom-nav">

                            <button class="lib-nav" data-lib-tab="tracks">
                                <span class="lib-nav-label">tracks</span>
                            </button>
                            <button class="lib-nav" data-lib-tab="playlists">
                                <span class="lib-nav-label">playlists</span>
                            </button>
                            <button class="lib-nav" data-lib-tab="albums">
                                <span class="lib-nav-label">albums</span>
                            </button>
                            <button class="lib-nav" data-lib-tab="artists">
                                <span class="lib-nav-label">artists</span>
                            </button>

                        </div>
                    </div>

                    <div id="tracks-lib-container" class="ss-playlist-list">
                        <!-- Liked tracks will be injected here -->
                    </div>

                    <div id="playlists-grid-ss" class="ss-playlist-list">
                        <!-- Playlists will be injected here -->
                    </div>

                    <div id="artists-lib-container" class="ss-playlist-list">
                        <!-- Artists will be injected here -->
                    </div>

                    <div id="albums-lib-container" class="ss-playlist-list">
                        <!-- Albums will be injected here -->
                    </div>



                </div>
                <div class="library-header-ss">
                    <h2 class="neon-text">LIBRARY</h2>
                    <div id="current_library-label-container">
                        <div id="current_library-label"></div>
                    </div>
                </div>

            </div>

            <!-- Create Playlist Modal -->
            <div id="create-playlist-modal" class="ss-modal-overlay hidden">
                <div class="ss-modal-window">
                    <h3>New Playlist</h3>
                    <div class="ss-modal-body">
                        <div class="ss-modal-cover">
                            <span>Image</span>
                        </div>
                        <div class="ss-modal-inputs">
                            <input type="text" id="playlist_title" placeholder="Playlist Title" autocomplete="off" required minlength="1" maxlength="50">
                            <div id="playlist-title-error" class="error-msg"></div>
                        </div>
                    </div>
                    <div class="ss-modal-actions">
                        <button id="create-playlist-cancel" class="ss-text-btn">Cancel</button>
                        <button id="create-playlist-confirm" class="ss-text-btn ss-action-accent">Create</button>
                    </div>
                </div>
            </div>

            <!-- Add to Playlist Modal -->
            <div id="add-to-playlist-modal" class="ss-modal-overlay hidden">
                <div class="ss-modal-window">
                    <h3>Add to Playlist</h3>
                    <div id="select-playlist-list" class="ss-playlist-select-list">
                        <!-- Playlists injected here -->
                    </div>
                    <div class="ss-modal-actions">
                        <button id="add-to-playlist-cancel" class="ss-text-btn">Cancel</button>
                    </div>
                </div>
            </div>

            <!-- YouTube Playlist Picker -->
            <div id="youtube-playlist-modal" class="ss-modal-overlay hidden">
                <div class="ss-modal-window" style="max-width: 450px;">
                    <h3>Select YouTube Playlist</h3>
                    <div id="youtube-playlists-container" style="max-height: 400px; overflow-y: auto; margin: 15px 0; display: flex; flex-direction: column; gap: 6px;">
                        <!-- YouTube playlists will be injected here -->
                    </div>
                    <div class="ss-modal-actions">
                        <button id="close-youtube-modal" class="ss-text-btn">Cancel</button>
                    </div>
                </div>
            </div>

            <!-- Import Loading Indicator -->
            <div id="import-loading-overlay" class="ss-modal-overlay hidden" style="z-index: 9999; background: rgba(0,0,0,0.85); flex-direction: column; justify-content: center; align-items: center;">
                <div class="loading-spinner" style="width: 60px; height: 60px; border: 5px solid rgba(255,255,255,0.1); border-top-color: coral; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
                <h2 id="import-loading-text" style="color: white; font-size: 1.5rem; font-weight: 300; letter-spacing: 0.1em; text-align: center;">Importing Spirits...</h2>
                <p id="import-loading-subtext" style="color: rgba(255,255,255,0.6); margin-top: 10px; text-align: center;"></p>
            </div>

            <style>
                @keyframes spin { to { transform: rotate(360deg); } }
                .yt-playlist-item {
                    padding: 12px 16px;
                    background: rgba(255,255,255,0.05);
                    border-radius: 8px;
                    cursor: pointer;
                    transition: all 0.2s;
                    border: 1px solid transparent;
                    text-align: left;
                }
                .yt-playlist-item:hover {
                    background: rgba(255,255,255,0.1);
                    border-color: rgba(255,255,255,0.2);
                }
                .yt-playlist-title {
                    color: white;
                    font-weight: 500;
                    display: block;
                    font-size: 14px;
                }
            </style>

            <div class="panel" id="search-panel">
                <div id="search-results-container"></div>
            </div>

            <div class="panel" id="player-panel">
                <div id="player-panel-container-bg-container">
                    <img src="" alt="bg"/>
                </div>
                <div id="player-panel-container">
                    <div id="track-cover-and-context-buttons-container">
                        <div id="track-cover-container">
                            <img id="track-cover" alt="cover" src=""/>
                        </div>

                        <div id="track-context-buttons-container">
                            <div id="like-button-container"></div>
                            <div id="add-button-container"></div>
                            <div id="download-button-container"></div>
                            <div id="share-button-container"></div>
                        </div>
                        <div id="player-panel-container-track-info">
                            <div id="track-title-container">
                                <div class="title-wrapper">
                                    <div id="playing-bars">
                                        <div class="bar"></div>
                                        <div class="bar"></div>
                                        <div class="bar"></div>
                                    </div>
                                    <div id="track-title"></div>
                                </div>


                            </div>

                            <div id="track-info-details">
                                <div id="track-artist-container">
                                    <div id="track-artist-icon"><i class="fa-solid fa-user"></i></div>
                                    <div id="track-artist-label" class="single-line-text"></div>
                                </div>
                                <div id="track-album-container">
                                    <div id="track-album-icon"><i class="fa-solid fa-compact-disc"></i></div>
                                    <div id="track-album-label" class="single-line-text"></div>
                                </div>
                            </div>


                            <div id="track-artist-and-album-container">
                                <div class="actions-view-static">
                                    <button class="action-btn" id="btn-like"><i class="fa-solid fa-heart" style="color:#2cec9b; font-size:large;"></i></button>
                                    <button class="action-btn" id="btn-add"><i class="fa-solid fa-plus" style="color:#2cec9b; font-size:large;"></i></button>
                                    <div id="quality-selector-wrap">
                                        <select id="quality-selector" title="Quality">
                                            <option value="7">FLAC/7</option>
                                            <option value="6">FLAC/6</option>
                                            <option value="5">MP3/5</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>





                    <div id="now_play_bottom_panel_part">

                        <div id="player-controls-container">
                            <button id="backward-button-container" class="player-controls-button" aria-label="Previous track"><i class="fa-solid fa-backward"></i></button>
                            <button id="play-button-container" class="player-controls-button" aria-label="Play or pause"><i class="fa-solid fa-play"></i></button>
                            <button id="forward-button-container" class="player-controls-button" aria-label="Next track"><i class="fa-solid fa-forward"></i></button>
                        </div>

                        <div id="player-timebar-container">
                            <div id="timebar-progress-container">
                                <div id="timebar-progress"></div>
                                <svg id="timebar-waveform" viewBox="0 0 1000 100" preserveAspectRatio="none" style="width: 100%; height: 100%; position: absolute; left: 0; top: 0; pointer-events: none; z-index: 3;">
                                    <defs>
                                        <clipPath id="waveform-clip">
                                            <rect id="waveform-clip-rect" x="0" y="0" width="0" height="100" />
                                        </clipPath>
                                    </defs>
                                    <g id="waveform-background" fill="rgba(255, 255, 255, 0.25)"></g>
                                    <g id="waveform-foreground" fill="#ccff0af9" clip-path="url(#waveform-clip)"></g>
                                    <rect class="waveform-playhead" fill="#ffffff" width="8" height="0" rx="4" ry="4" style="display: none; filter: drop-shadow(0px 0px 5px rgba(255, 255, 255, 0.95)) !important; opacity: 1;" />
                                    <rect class="waveform-playhead" fill="#ffffff" width="8" height="0" rx="4" ry="4" style="display: none; filter: drop-shadow(0px 0px 5px rgba(255, 255, 255, 0.7)) !important; opacity: 0.75;" />
                                </svg>
                            </div>
                            <div id="time-container">
                                <span id="current-time">0:00</span>
                                <span id="duration">0:00</span>
                            </div>
                        </div>

                        <div id="track-quality-info"></div>
                        <button id="track-download-btn" title="Download Track">
                            <i class="fa-solid fa-download"></i> DOWNLOAD
                        </button>

                    </div>

                </div>

            </div>

            <!-- ARTIST OVERLAY -->
            <div id="artist-panel" class="panel overlay-panel">
                <div class="scroll-content" id="artist-content">
                    <!-- Content will be injected here -->
                </div>
                <div class="overlay-bottom-controls">
                    <button class="overlay-bottom-btn" id="close-artist-panel"><i data-lucide="chevron-down"></i></button>
                    <button id="add-artist-to-lib" class="overlay-bottom-btn accent">
                        <i data-lucide="user-plus"></i>
                    </button>
                </div>
            </div>

            <!-- ALBUM OVERLAY -->
            <div id="album-panel" class="panel overlay-panel">
                <div class="playlist-blur-bg" id="album-blur-bg-ss"></div>
                <div class="scroll-content" id="album-content">
                    <!-- Content will be injected here -->
                </div>
                <button id="album-close-fab" class="close-fab">
                    <i data-lucide="chevron-down"></i>
                </button>
            </div>

            <!-- SELECTED PLAYLIST OVERLAY -->
            <div id="playlist-panel" class="panel overlay-panel">
                <div class="playlist-blur-bg" id="playlist-blur-bg-ss"></div>
                <div class="scroll-content" id="playlist-content-ss">
                    <!-- Tracks will be injected here -->
                </div>
                <button id="playlist-close-fab" class="close-fab">
                    <i data-lucide="x"></i>
                </button>
            </div>
        </div>

        <nav class="bottom-navbar">
            <div id="bottom-nav-buttons-container">
                <button id="close-button" class="nav-button" data-panel="user-panel">
                    <i class="fa-solid fa-user"></i>
                    <span class="nav-button-label">profile</span>
                </button>
                <button class="nav-button" data-panel="library-panel">
                    <i class="fa-solid fa-music"></i>
                    <span class="nav-button-label">library</span>
                </button>
                <button class="nav-button" data-panel="player-panel">
                    <i class="fa-regular fa-circle-play"></i>
                    <span class="nav-button-label">player</span>
                </button>
                <button id="search-button" class="nav-button" data-panel="search-panel">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span class="nav-button-label">search</span>
                </button>
            </div>
        </nav>
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>
