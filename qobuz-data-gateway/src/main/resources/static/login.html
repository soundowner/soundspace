<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soundspace | Entry</title>
    <script src="tailwindcss.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #010101;
            color: white;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .brand-title {
    position: absolute;
    top: 2rem;
    left: 26%;
    font-family: 'Syncopate', sans-serif;
    font-weight: 900;
    font-size: 1.2rem;
    letter-spacing: 0.4px;
    color: rgb(255 255 255);
    z-index: 100;
    text-transform: uppercase;
    text-align: center;
    width: 100%;
        }

        #brand-title-radio {
    position: absolute;
    top: 2%;
    letter-spacing: 3px;
    color: #00ffde;
    font-size: small;
    left: 85%;
        }

        /* Ambient Glow - More subtle, "breathing" */
        .ambient-glow {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            transition: all 1.5s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
        }
        .active-ambient { opacity: 0.4; }
        .ambient-cyan { background: radial-gradient(circle at 50% 50%, rgba(0, 255, 204, 0.08), transparent 70%); }
        .ambient-pink { background: radial-gradient(circle at 50% 50%, rgba(255, 0, 85, 0.08), transparent 70%); }

        /* Initial Choice Screen - "The Split Gate" */
        .choice-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .choice-wrapper.hidden {
            transform: scale(1.1);
            opacity: 0;
            pointer-events: none;
            filter: blur(10px);
        }

        .split-line {
            width: 1px;
            height: 100px;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.1), transparent);
            margin: 2rem 0;
            transition: all 0.6s ease;
        }

        .gate-btn {
            font-family: 'Syncopate', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            background: none;
            border: none;
            color: rgba(255,255,255,0.15);
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            padding: 10px 40px;
        }

        .gate-btn:hover {
            color: white;
            letter-spacing: 0.5em;
        }

        .btn-in:hover { text-shadow: 0 0 30px rgba(0, 255, 204, 0.6); }
        .btn-up:hover { text-shadow: 0 0 30px rgba(255, 0, 85, 0.6); }

        .gate-btn::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            transition: width 0.5s ease;
        }
        .btn-in:hover::after { width: 100%; background: #00ffcc; box-shadow: 0 0 15px #00ffcc; }
        .btn-up:hover::after { width: 100%; background: #ff0055; box-shadow: 0 0 15px #ff0055; }

        /* Auth Screen */
        #auth-screen {
            position: absolute;
            width: 100%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 20;
        }
        #auth-screen.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .auth-header {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.4em;
            margin-bottom: 5rem;
            text-align: center;
            opacity: 0.8;
        }
        .cyan-theme .auth-header { color: #00ffcc; text-shadow: 0 0 20px rgba(0, 255, 204, 0.3); }
        .pink-theme .auth-header { color: #ff0055; text-shadow: 0 0 20px rgba(255, 0, 85, 0.3); }

        /* Forms */
        .auth-form { width: 100%; display: none; }
        .auth-form.active { display: block; }

        .input-group {
            position: relative;
            margin-bottom: 3rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.6s ease;
        }
        #auth-screen.active .input-group { opacity: 1; transform: translateY(0); }
        #auth-screen.active .input-group:nth-child(1) { transition-delay: 0.3s; }
        #auth-screen.active .input-group:nth-child(2) { transition-delay: 0.45s; }
        #auth-screen.active .input-group:nth-child(3) { transition-delay: 0.6s; }

        .data-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 0.6rem 0;
            font-size: 0.9rem;
            color: white;
            outline: none;
            transition: all 0.4s ease;
            font-family: inherit;
        }
        .cyan-theme .data-input:focus { border-bottom-color: #00ffcc; box-shadow: 0 1px 0 #00ffcc; }
        .pink-theme .data-input:focus { border-bottom-color: #ff0055; box-shadow: 0 1px 0 #ff0055; }

        .input-label {
            position: absolute;
            left: 0;
            top: -1.2rem;
            font-size: 0.55rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.2);
            pointer-events: none;
        }
        .data-input:focus + .input-label { color: rgba(255,255,255,0.8); }

        /* Centered Actions */
        .actions-stack {
            margin-top: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4rem;
            width: 100%;
        }

        .submit-btn {
            background: none;
            border: none;
            font-family: 'Syncopate', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5em;
            cursor: pointer;
            color: white;
            opacity: 0.4;
            transition: all 0.4s ease;
        }
        .submit-btn:hover { opacity: 1; letter-spacing: 0.7em; }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 3.2rem;
            height: 3.2rem;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.05);
            color: white;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.1rem;
            background: rgba(255,255,255,0.02);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .google-btn:hover {
            border-color: rgba(255,255,255,0.3);
            transform: scale(1.1) rotate(5deg);
            background: rgba(255,255,255,0.05);
            box-shadow: 0 0 30px rgba(255,255,255,0.05);
        }

        /* Back */
        .back-btn {
            position: absolute;
            bottom: 4rem;
            font-family: 'Syncopate', sans-serif;
            font-size: 0.5rem;
            letter-spacing: 0.4em;
            color: rgba(255,255,255,0.15);
            background: none;
            border: none;
            cursor: pointer;
            opacity: 0;
            transition: all 0.5s ease;
        }
        .back-btn:hover { color: white; opacity: 1; }
        #auth-screen.active ~ .back-btn { opacity: 1; pointer-events: auto; }

    </style>
</head>
<body id="body-container">

    <div class="brand-title">Soundspace</div><span id="brand-title-radio">RADIO</span>

    <div id="ambient-c" class="ambient-glow ambient-cyan"></div>
    <div id="ambient-p" class="ambient-glow ambient-pink"></div>

    <!-- CHOICE SCREEN -->
    <div id="choice-screen" class="choice-wrapper">
        <button id="btn-choice-signin" class="gate-btn btn-in">SIGN IN</button>
        <div class="split-line"></div>
        <button id="btn-choice-signup" class="gate-btn btn-up">SIGN UP</button>
    </div>

    <!-- AUTH SCREEN -->
    <div id="auth-screen">
        <div id="auth-title" class="auth-header">SIGN IN</div>

        <form id="login-form" class="auth-form">
            <div class="input-group">
                <input type="email" id="login-email" class="data-input" placeholder=" " required autocomplete="off">
                <label class="input-label">[Email]</label>
            </div>
            <div class="input-group">
                <input type="password" id="login-password" class="data-input" placeholder=" " required>
                <label class="input-label">[Passkey]</label>
            </div>

            <div class="actions-stack">
                <button type="submit" class="submit-btn">PROCEED</button>
                <a href="/auth/login/oauth2/google" class="google-btn">G</a>
            </div>
        </form>

        <form id="register-form" class="auth-form">
            <div class="input-group">
                <input type="text" id="reg-name" class="data-input" placeholder=" " required autocomplete="off">
                <label class="input-label">[Name]</label>
            </div>
            <div class="input-group">
                <input type="email" id="reg-email" class="data-input" placeholder=" " required autocomplete="off">
                <label class="input-label">[Email]</label>
            </div>
            <div class="input-group">
                <input type="password" id="reg-password" class="data-input" placeholder=" " required>
                <label class="input-label">[Passkey]</label>
            </div>

            <div class="actions-stack">
                <button type="submit" class="submit-btn">INITIALIZE</button>
                <a href="/auth/login/oauth2/google" class="google-btn">G</a>
            </div>
        </form>
    </div>

    <button id="btn-back" class="back-btn">RETURN / ESC</button>

    <script>
        const body = document.getElementById('body-container');
        const choiceScreen = document.getElementById('choice-screen');
        const authScreen = document.getElementById('auth-screen');
        const authTitle = document.getElementById('auth-title');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const ambC = document.getElementById('ambient-c');
        const ambP = document.getElementById('ambient-p');

        const btnIn = document.getElementById('btn-choice-signin');
        const btnUp = document.getElementById('btn-choice-signup');
        const btnBack = document.getElementById('btn-back');

        function showAuth(title, theme, ambientSide, form) {
            authTitle.innerText = title;
            body.className = theme;

            if(ambientSide === 'cyan') {
                ambC.classList.add('active-ambient');
                ambP.classList.remove('active-ambient');
            } else {
                ambP.classList.add('active-ambient');
                ambC.classList.remove('active-ambient');
            }

            form.classList.add('active');
            (form === loginForm ? registerForm : loginForm).classList.remove('active');

            choiceScreen.classList.add('hidden');
            setTimeout(() => authScreen.classList.add('active'), 600);

            setTimeout(() => form.querySelector('input').focus(), 1400);
        }

        btnIn.addEventListener('click', () => showAuth('SIGN IN', 'cyan-theme', 'cyan', loginForm));
        btnUp.addEventListener('click', () => showAuth('SIGN UP', 'pink-theme', 'pink', registerForm));

        btnBack.addEventListener('click', () => {
            body.className = '';
            ambC.classList.remove('active-ambient');
            ambP.classList.remove('active-ambient');
            authScreen.classList.remove('active');
            setTimeout(() => {
                choiceScreen.classList.remove('hidden');
                document.querySelectorAll('input').forEach(i => i.value = '');
            }, 600);
        });

        // ESC key back
        window.addEventListener('keydown', (e) => {
            if(e.key === 'Escape' && authScreen.classList.contains('active')) {
                btnBack.click();
            }
        });

        // Request Logic
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await handleAuth('/auth/login', {
                email: document.getElementById('login-email').value,
                password: document.getElementById('login-password').value
            }, true);
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const success = await handleAuth('/auth/register', {
                displayName: document.getElementById('reg-name').value,
                email: document.getElementById('reg-email').value,
                password: document.getElementById('reg-password').value
            }, false);
            if (success) btnIn.click();
        });

        async function handleAuth(url, bodyData, isLogin) {
            const form = isLogin ? loginForm : registerForm;
            const btn = form.querySelector('.submit-btn');
            const originalText = btn.innerText;
            btn.innerText = 'PROCESSING';
            btn.disabled = true;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });
                if (response.ok) {
                    if (isLogin) {
                        btn.innerText = 'SUCCESS';
                        setTimeout(() => window.location.href = '/index.html', 500);
                    }
                    return true;
                } else {
                    btn.innerText = 'ACCESS DENIED';
                    setTimeout(() => btn.innerText = originalText, 2000);
                    return false;
                }
            } catch (err) {
                btn.innerText = 'OFFLINE';
                setTimeout(() => btn.innerText = originalText, 2000);
                return false;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
