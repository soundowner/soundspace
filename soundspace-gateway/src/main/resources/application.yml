server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: soundspace-gateway
  cloud:
    gateway:
      default-filters:
        - PreserveHostHeader
      routes:
        - id: auth-server
          uri: http://auth-server:8081
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

        - id: qobuz-api
          uri: http://qobuz-api-gateway:8082
          predicates:
            - Path=/data/audio/**

        - id: qobuz-static
          uri: http://qobuz-api-gateway:8082
          predicates:
            - Path=/**

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    org.springframework.cloud.gateway: TRACE
